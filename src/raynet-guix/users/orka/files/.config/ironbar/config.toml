# Ironbar config — replaces waybar on niri
position = "top"
anchor_to_edges = true
height = 30
spacing = 4
popup_gap = 5

# ── Left ─────────────────────────────────────────────────────────────
[[start]]
type = "custom"
name = "launcher"
bar = [
  { type = "button", name = "launcher-btn", label = "", on_click = "!fuzzel" }
]

[[start]]
type = "workspaces"
name = "workspaces"
all_monitors = false

[[start]]
type = "focused"
name = "window"
show_icon = false
truncate.mode = "end"
truncate.length = 50

# ── Center ───────────────────────────────────────────────────────────
[[center]]
type = "clock"
name = "clock"
format = "󰃭 %Y-%m-%d %H:%M"

[[center]]
type = "music"
name = "mpris"
player_type = "mpris"
format = "{icon} {title} - {artist}"
format_paused = "{icon} {title} - {artist}"
icons.play = "󰐎"
icons.pause = "󰏤"
truncate.mode = "end"
truncate.length = 30

# ── Right ─────────────────────────────────────────────────────────────
[[end]]
type = "sys_info"
name = "cpu"
format = ["󰻠 {cpu_percent}%"]
interval = 5
on_click_left = "ghostty -e btop"
on_click_right = "ghostty -e btop"

[[end]]
type = "sys_info"
name = "memory"
format = ["󰍛 {memory_percent}%"]
interval = 5
on_click_left = "ghostty -e btop"
on_click_right = "ghostty -e btop"

[[end]]
type = "network_manager"
name = "network"
format_connected = " {ssid} ({signal_strength}%)"
format_disconnected = "󰖪 Disconnected"
format_connecting = "󰖪 …"
on_click_left = "!nmcli radio wifi | grep -q 'enabled' && nmcli radio wifi off || nmcli radio wifi on"
on_click_right = "!nm-connection-editor"

[[end]]
type = "bluetooth"
name = "bluetooth"
disable_popup = true
on_click_left = "!overskride"
on_click_right = "!bluetoothctl show | grep -q 'Powered: yes' && bluetoothctl power off || bluetoothctl power on"
[end.format]
enabled = "󰂯 On"
disabled = "󰂲 Off"
connected = "󰂱 {device_alias}"

[[end]]
type = "volume"
name = "volume"
format = "{icon} {percentage}%"
format_muted = "{icon} Muted"
icons.volume_high = ""
icons.volume_medium = ""
icons.volume_low = ""
icons.muted = "󰝟"



[[end]]
type = "brightness"
name = "backlight"
format = "{icon} {percentage}%"
icons = ["󰃚", "󰃛", "󰃜", "󰃝", "󰃞", "󰃟", "󰃠"]

# power-profiles-daemon — script widget (no native ironbar widget)
[[end]]
type = "script"
name = "power-profile"
cmd = "prof=$(powerprofilesctl get 2>/dev/null || echo balanced); case \"$prof\" in performance) echo '󰓅' ;; power-saver) echo '󰾆' ;; *) echo '󰾅' ;; esac"
interval = 10000

[[end]]
type = "battery"
name = "battery"
format = "{percentage}%"

[[end]]
type = "custom"
name = "weather"
bar = [
  { type = "script", name = "weather-script", cmd = "curl -s 'wttr.in/?format=%c+%t' | head -n1", interval = 1800000, on_click_left = "!xdg-open https://wttr.in" }
]

[[end]]
type = "script"
name = "disk"
cmd = "df -h / | awk 'NR==2 {print \"󰋊 \" $4}'"
interval = 60000

[[end]]
type = "script"
name = "fcitx5"
cmd = "fcitx5-remote 2>/dev/null | grep -q '2' && echo '󰘳 한' || echo '󰘳 En'"
interval = 5000

[[end]]
type = "tray"
name = "tray"

# swaync notification bell — dynamic script wrapped in custom for click support
[[end]]
type = "custom"
name = "notifications"
bar = [
  { type = "script", name = "notif-script", cmd = "is_dnd=$(swaync-client -D); count=$(swaync-client -c); if [ \"$is_dnd\" = \"true\" ]; then echo \"󰂛\"; elif [ \"$count\" -gt 0 ]; then echo \"󱅫 $count\"; else echo \"󰂚\"; fi", interval = 5000, on_click_left = "swaync-client -t -sw", on_click_right = "swaync-client -d" }
]

[[end]]
type = "custom"
name = "lock"
bar = [
  { type = "button", name = "lock-btn", label = "󰌾", on_click = "!dms ipc call lock lock" }
]

[[end]]
type = "custom"
name = "suspend"
bar = [
  { type = "button", name = "suspend-btn", label = "󰤄", on_click = "!loginctl suspend" }
]

[[end]]
type = "custom"
name = "power"
bar = [
  { type = "button", name = "power-btn", label = "⏻", on_click = "!wlogout" }
]
