# himalaya (v2) configuration.
# Policy: no mail data on the SSD. himalaya reads IMAP live through a sirup
# socket (which lives in $XDG_RUNTIME_DIR, a tmpfs); downloads go to /tmp.
# Secrets never live here: use `password.command = ["pass", "show", ...]`.

downloads-dir = "/tmp/himalaya-downloads"

# himalaya v2 requires an `accounts` table even when it is empty. `himalaya configure`
# appends `[accounts.<name>]` below; keep this line.
[accounts]

# --- Gmail via OAuth2 ----------------------------------------------------------
# Token manager: ortie (account "gmail"; refreshes tokens on demand).
# Needs sirup running first:  sirup start --account gmail
[accounts.gmail]
default = true
email = "evian2389@gmail.com"
imap.server = "unix:///run/user/1000/sirup/gmail-imap.sock"
smtp.server = "unix:///run/user/1000/sirup/gmail-smtp.sock"
# This account's special folders are in mixed locales (checked with `mailbox list`):
# Drafts/Trash are English (roles detected), All Mail is "[Gmail]/전체보관함".
# No `sent` alias: Gmail saves sent mail itself when sending through SMTP.
mailbox.alias.drafts = "[Gmail]/Drafts"
mailbox.alias.trash = "[Gmail]/Trash"
mailbox.alias.archive = "[Gmail]/전체보관함"
