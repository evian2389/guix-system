[opener]
edit = [
  { run = 'hx "$@"', block = true, desc = "Helix" },
]
miro_pdf = [
  { run = 'miro-pdf %s', orphan = true, desc = "Miro PDF" },
]
zed_custom = [
    { run = 'zeditor "$@"', block = false, desc = "Zed Editor" },
]
open = [
  { run = 'imv %s1', orphan = true, desc = "Open image in imv" },
]
gthumb = [
  { run = 'gthumb --new-window %s', orphan = true, desc = "Open selected images in gThumb (print)" },
]
gimp = [
  { run = 'gimp %s1', orphan = true, desc = "Open image in GIMP (print)" },
]

[open]
prepend_rules = [
  { mime = "image/*", use = ["open", "gthumb", "gimp"] },
  { mime = "application/pdf", use = "miro_pdf" },
  { mime = "text/*", use = "edit" },
]

[plugin]
prepend_previewers = [
    { mime = "application/pdf", run = "bookokrat-preview" },
]
append_spotters = [
    { url = "*", run = "file-extra-metadata" }
]

[mgr]
ratio = [1, 4, 3]
linemode = "size" # Options: "none", "size", "mtime", "btime", "permissions", "owner"
