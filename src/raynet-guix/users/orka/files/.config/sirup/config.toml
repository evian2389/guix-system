# sirup configuration. Sockets default to $XDG_RUNTIME_DIR/sirup/ (tmpfs).
# Generate an account with `sirup configure`, or fill the template by hand.
# Keep credentials out of this file: use password.command / token.command.

# sirup requires an `accounts` table even when it is empty; `sirup configure`
# appends `[accounts.<name>]` below. Keep this line.
[accounts]

# --- Gmail via OAuth2 -----------------------------------------------------------
# Token comes from ortie (`ortie auth get` once, then refreshed on demand);
# nothing secret lives in this file.
[accounts.gmail]
default = true
imap.server = "imap.gmail.com"
imap.sasl.xoauth2.username = "evian2389@gmail.com"
imap.sasl.xoauth2.token.command = ["ortie", "token", "show", "-a", "gmail"]
smtp.server = "smtp.gmail.com"
smtp.sasl.xoauth2.username = "evian2389@gmail.com"
smtp.sasl.xoauth2.token.command = ["ortie", "token", "show", "-a", "gmail"]
